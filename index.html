<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GlucoScan</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  :root {
    --bg: #0a0a0a;
    --card: #161616;
    --border: rgba(255,255,255,0.07);
    --accent: #3b82f6;
    --accent-dim: rgba(59,130,246,0.15);
    --text: #f0f0f0;
    --text-muted: #888;
    --low: #ef4444;
    --normal: #22c55e;
    --high: #f59e0b;
    --very-high: #ef4444;
    --tab-h: 64px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Inter', system-ui, sans-serif;
    overflow: hidden;
  }

  /* ── SCREENS ── */
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; overflow: hidden; }
  .screen.active { display: flex; }

  .scroll-area {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding-bottom: calc(var(--tab-h) + var(--safe-bottom) + 80px);
    -webkit-overflow-scrolling: touch;
  }

  /* ── HEADER ── */
  .app-header {
    padding: 52px 20px 16px;
    background: var(--bg);
    flex-shrink: 0;
  }
  .app-header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .app-header p { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

  /* ── CARDS ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    margin: 0 16px 14px;
  }
  .card-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }

  /* ── LATEST READING ── */
  .latest-value {
    font-size: 72px;
    font-weight: 800;
    letter-spacing: -3px;
    line-height: 1;
  }
  .latest-unit { font-size: 18px; font-weight: 400; color: var(--text-muted); margin-left: 4px; }
  .status-badge {
    display: inline-block;
    margin-top: 10px;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .badge-low    { background: rgba(239,68,68,0.18); color: var(--low); }
  .badge-normal { background: rgba(34,197,94,0.18); color: var(--normal); }
  .badge-high   { background: rgba(245,158,11,0.18); color: var(--high); }
  .badge-veryhigh { background: rgba(239,68,68,0.18); color: var(--very-high); }

  .no-data-hint { color: var(--text-muted); font-size: 15px; padding: 8px 0; }

  /* ── STATS ROW ── */
  .stats-row { display: flex; gap: 10px; margin: 0 16px 14px; }
  .stat-chip {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 8px;
    text-align: center;
  }
  .stat-chip .val { font-size: 20px; font-weight: 700; }
  .stat-chip .lbl { font-size: 10px; color: var(--text-muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.5px; }

  /* ── CHART ── */
  .chart-toggles { display: flex; gap: 6px; margin-bottom: 14px; }
  .toggle-btn {
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .toggle-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  #trendCanvas { width: 100%; border-radius: 8px; display: block; }

  /* ── TAB BAR ── */
  .tab-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: calc(var(--tab-h) + var(--safe-bottom));
    background: rgba(10,10,10,0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 100;
    padding-bottom: var(--safe-bottom);
  }
  .tab-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 500;
    cursor: pointer;
    transition: color 0.15s;
  }
  .tab-btn .tab-icon { font-size: 22px; }
  .tab-btn.active { color: var(--accent); }

  /* ── FAB ── */
  #fabScan {
    position: fixed;
    bottom: calc(var(--tab-h) + var(--safe-bottom) + 14px);
    left: 50%;
    transform: translateX(-50%);
    width: 64px; height: 64px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    color: white;
    font-size: 26px;
    cursor: pointer;
    z-index: 200;
    box-shadow: 0 4px 24px rgba(59,130,246,0.5);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  #fabScan:active { transform: translateX(-50%) scale(0.93); box-shadow: 0 2px 12px rgba(59,130,246,0.4); }

  /* ── HISTORY ── */
  .history-header {
    padding: 52px 20px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .history-header h2 { font-size: 22px; font-weight: 700; }
  .export-btn {
    padding: 7px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .day-group { padding: 0 16px; margin-bottom: 6px; }
  .day-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; padding: 10px 0 6px; }
  .reading-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .reading-row:active { background: rgba(255,255,255,0.05); }
  .color-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .row-value { font-size: 18px; font-weight: 700; min-width: 52px; }
  .row-tag { font-size: 12px; color: var(--text-muted); flex: 1; }
  .row-time { font-size: 12px; color: var(--text-muted); }
  .empty-history { text-align: center; color: var(--text-muted); padding: 60px 20px; font-size: 15px; }

  /* ── MODAL OVERLAY ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 300;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-sheet {
    background: #1a1a1a;
    border-radius: 24px 24px 0 0;
    padding: 24px 24px calc(24px + var(--safe-bottom));
    width: 100%;
    max-width: 480px;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 18px; }
  .modal-close {
    float: right;
    background: rgba(255,255,255,0.08);
    border: none; color: var(--text);
    width: 30px; height: 30px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  /* ── CAMERA SCREEN ── */
  #cameraScreen {
    background: #000;
    z-index: 400;
  }
  #cameraScreen .cam-header {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 50px 20px 16px;
    display: flex; align-items: center; gap: 14px;
    z-index: 10;
  }
  .back-btn {
    background: rgba(255,255,255,0.12);
    border: none; color: white;
    width: 38px; height: 38px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .cam-title { color: white; font-size: 17px; font-weight: 600; }
  #videoEl {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .cam-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 5; pointer-events: none;
  }
  .guide-box {
    width: 75vw; max-width: 300px;
    aspect-ratio: 2.5 / 1;
    border: 2px solid rgba(255,255,255,0.8);
    border-radius: 10px;
    position: relative;
  }
  .guide-box::before {
    content: 'Line up meter display';
    position: absolute; top: -28px; left: 0; right: 0;
    text-align: center; color: white; font-size: 13px;
    font-weight: 500; text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }
  /* Corner accents */
  .guide-box::after {
    content: '';
    position: absolute; inset: -2px;
    border-radius: 10px;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.45);
  }
  .cam-bottom {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 24px 24px calc(24px + var(--safe-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    z-index: 10;
  }
  #captureBtn {
    width: 70px; height: 70px; border-radius: 50%;
    background: white; border: 4px solid rgba(255,255,255,0.4);
    cursor: pointer; transition: transform 0.12s;
  }
  #captureBtn:active { transform: scale(0.9); }
  .cam-hint { color: rgba(255,255,255,0.6); font-size: 12px; }
  .manual-fallback {
    color: var(--accent); font-size: 14px; font-weight: 500;
    background: none; border: none; cursor: pointer; padding: 4px 8px;
  }
  #processingOverlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.75);
    display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; z-index: 20;
  }
  #processingOverlay.show { display: flex; }
  .spinner {
    width: 40px; height: 40px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.2);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .proc-text { color: white; font-size: 14px; }

  /* ── CONFIRM SCREEN ── */
  #confirmScreen { z-index: 500; background: var(--bg); }
  #confirmScreen .confirm-header {
    padding: 52px 20px 16px;
    display: flex; align-items: center; gap: 14px;
    flex-shrink: 0;
  }
  .confirm-body { padding: 0 20px; flex: 1; overflow-y: auto; }
  .confirm-found {
    text-align: center; padding: 30px 0 24px;
  }
  .confirm-found .big-num {
    font-size: 80px; font-weight: 800; letter-spacing: -3px;
    line-height: 1;
  }
  .confirm-found .unit-label { font-size: 20px; color: var(--text-muted); }
  .confirm-label { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
  .tags-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .tag-pill {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tag-pill.selected { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .save-btn {
    width: 100%; padding: 16px;
    background: var(--accent); border: none;
    color: white; font-size: 16px; font-weight: 700;
    border-radius: 14px; cursor: pointer;
    transition: opacity 0.15s;
    margin-bottom: 12px;
  }
  .save-btn:active { opacity: 0.85; }
  .rescan-btn {
    width: 100%; padding: 14px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--text-muted); font-size: 14px; font-weight: 600;
    border-radius: 14px; cursor: pointer;
    margin-bottom: calc(var(--tab-h) + var(--safe-bottom) + 20px);
  }

  /* ── MANUAL ENTRY ── */
  .manual-input-wrap { position: relative; margin-bottom: 20px; }
  .manual-input {
    width: 100%; padding: 16px 60px 16px 18px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; color: var(--text); font-size: 28px;
    font-weight: 700; outline: none; text-align: center;
    -webkit-appearance: none;
  }
  .manual-input:focus { border-color: var(--accent); }
  .manual-unit { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; }

  /* ── DELETE CONFIRM ── */
  .delete-actions { display: flex; gap: 10px; margin-top: 10px; }
  .del-cancel { flex:1; padding: 14px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; color: var(--text-muted); font-size: 14px; font-weight: 600; cursor: pointer; }
  .del-confirm { flex:1; padding: 14px; background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); border-radius: 12px; color: var(--low); font-size: 14px; font-weight: 600; cursor: pointer; }

  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: calc(var(--tab-h) + var(--safe-bottom) + 20px);
    left: 50%; transform: translateX(-50%) translateY(20px);
    background: #333; color: white; padding: 10px 20px;
    border-radius: 20px; font-size: 13px; font-weight: 500;
    opacity: 0; transition: all 0.3s; z-index: 999; white-space: nowrap;
    pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- ════════════════════════════════════════════
     HOME SCREEN
════════════════════════════════════════════ -->
<div id="homeScreen" class="screen active">
  <div class="app-header greeting">
    <h1>GlucoScan</h1>
    <p>Track glucose in seconds</p>
  </div>
  <div class="scroll-area">
    <!-- Latest reading -->
    <div class="card" id="latestCard">
      <div class="card-label">Latest Reading</div>
      <div id="latestDisplay" class="no-data-hint">No readings yet — tap 📷 to scan</div>
    </div>

    <!-- Stats row -->
    <div class="stats-row">
      <div class="stat-chip"><div class="val" id="avg7">—</div><div class="lbl">7-Day Avg</div></div>
      <div class="stat-chip"><div class="val" id="avg30">—</div><div class="lbl">30-Day Avg</div></div>
      <div class="stat-chip"><div class="val" id="inRange">—</div><div class="lbl">% In Range</div></div>
    </div>

    <!-- Trend chart -->
    <div class="card">
      <div class="card-label">Trend</div>
      <div class="chart-toggles">
        <button class="toggle-btn active" data-days="10">10D</button>
        <button class="toggle-btn" data-days="30">30D</button>
        <button class="toggle-btn" data-days="365">1Y</button>
      </div>
      <canvas id="trendCanvas" height="160"></canvas>
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════════
     HISTORY SCREEN
════════════════════════════════════════════ -->
<div id="historyScreen" class="screen">
  <div class="history-header">
    <h2>History</h2>
    <button class="export-btn" id="exportBtn">⬇ Export CSV</button>
  </div>
  <div class="scroll-area" id="historyList"></div>
</div>

<!-- ════════════════════════════════════════════
     CAMERA SCREEN
════════════════════════════════════════════ -->
<div id="cameraScreen" class="screen">
  <div class="cam-header">
    <button class="back-btn" id="closeCameraBtn">✕</button>
    <span class="cam-title">Scan Glucose Meter</span>
  </div>
  <video id="videoEl" autoplay playsinline muted></video>
  <div class="cam-overlay">
    <div class="guide-box"></div>
  </div>
  <div class="cam-bottom">
    <div class="cam-hint">Point camera at meter display</div>
    <button id="captureBtn"></button>
    <button class="manual-fallback" id="manualFallbackBtn">Enter manually instead</button>
  </div>
  <div id="processingOverlay">
    <div class="spinner"></div>
    <div class="proc-text" id="procText">Scanning...</div>
  </div>
</div>

<!-- ════════════════════════════════════════════
     CONFIRM SCREEN
════════════════════════════════════════════ -->
<div id="confirmScreen" class="screen">
  <div class="confirm-header">
    <button class="back-btn" id="closeConfirmBtn">✕</button>
    <span class="cam-title" id="confirmTitle">Confirm Reading</span>
  </div>
  <div class="confirm-body">
    <div class="confirm-found">
      <div class="big-num" id="confirmNum">—</div>
      <div class="unit-label">mg/dL</div>
    </div>
    <div class="confirm-label">Select tag (optional)</div>
    <div class="tags-grid" id="confirmTags"></div>
    <button class="save-btn" id="saveConfirmedBtn">Save Reading</button>
    <button class="rescan-btn" id="discardConfirmBtn">Discard</button>
  </div>
</div>

<!-- ════════════════════════════════════════════
     MANUAL ENTRY MODAL
════════════════════════════════════════════ -->
<div class="modal-overlay" id="manualModal">
  <div class="modal-sheet">
    <div class="modal-title">Manual Entry <button class="modal-close" id="closeManualBtn">✕</button></div>
    <div class="manual-input-wrap">
      <input type="number" class="manual-input" id="manualInput" placeholder="0" min="20" max="600" inputmode="numeric">
      <span class="manual-unit">mg/dL</span>
    </div>
    <div class="confirm-label">Tag (optional)</div>
    <div class="tags-grid" id="manualTags"></div>
    <button class="save-btn" id="manualSaveBtn">Save Reading</button>
  </div>
</div>

<!-- ════════════════════════════════════════════
     DELETE CONFIRM MODAL
════════════════════════════════════════════ -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal-sheet">
    <div class="modal-title">Delete Reading?</div>
    <div style="color:var(--text-muted);font-size:14px;" id="deleteDesc"></div>
    <div class="delete-actions">
      <button class="del-cancel" id="cancelDeleteBtn">Cancel</button>
      <button class="del-confirm" id="confirmDeleteBtn">Delete</button>
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════════
     TAB BAR + FAB
════════════════════════════════════════════ -->
<div class="tab-bar">
  <button class="tab-btn active" id="tabHome" data-tab="home">
    <span class="tab-icon">🏠</span>Home
  </button>
  <button class="tab-btn" id="tabHistory" data-tab="history">
    <span class="tab-icon">📋</span>History
  </button>
</div>
<button id="fabScan">📷</button>

<div id="toast"></div>

<!-- hidden canvas for OCR capture -->
<canvas id="captureCanvas" style="display:none"></canvas>

<script>
'use strict';
document.addEventListener('DOMContentLoaded', () => {
  const STORAGE_KEY = 'glucoscan_readings';
  const TAGS = ['Before meal', 'After meal', 'Fasting', 'Bedtime', 'Random'];
  let readings = [];
  let videoStream = null;
  let currentTag = '';
  let pendingValue = null;
  let pendingSource = 'manual';
  let pendingDeleteId = null;
  let currentRange = 10;
  let toastTimer = null;

  // ── INIT ──────────────────────────────────────────────────────
  loadReadings();
  updateGreeting();
  setupNav();
  setupChart();
  setupScan();
  setupManual();
  setupHistory();
  setupDelete();
  renderAll();

  // ── DATA ──────────────────────────────────────────────────────
  function loadReadings() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      readings = JSON.parse(raw);
    } else {
      readings = generateSamples();
      saveReadings();
    }
    readings.sort((a, b) => b.timestamp - a.timestamp);
  }

  function saveReadings() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(readings));
  }

  function addReading(value, tag, source) {
    readings.unshift({
      id: Math.random().toString(36).slice(2) + Date.now(),
      value,
      tag: tag || '',
      timestamp: Date.now(),
      source: source || 'manual'
    });
    saveReadings();
  }

  function deleteReadingById(id) {
    readings = readings.filter(r => r.id !== id);
    saveReadings();
  }

  function generateSamples() {
    const now = Date.now();
    const DAY = 86400000;
    const tagList = TAGS;
    const result = [];
    for (let d = 21; d >= 0; d--) {
      const count = 2 + Math.floor(Math.random() * 2);
      for (let i = 0; i < count; i++) {
        const t = now - d * DAY + (6 + i * 4.5 + Math.random() * 2) * 3600000;
        const bases = [95, 130, 155, 100, 140];
        const base = bases[i % bases.length];
        const val = Math.round(base + (Math.random() - 0.5) * 28);
        result.push({
          id: Math.random().toString(36).slice(2) + Math.round(t),
          value: Math.max(72, Math.min(175, val)),
          tag: tagList[i % tagList.length],
          timestamp: Math.round(t),
          source: 'sample'
        });
      }
    }
    result.sort((a, b) => b.timestamp - a.timestamp);
    return result;
  }

  // ── CLASSIFY ──────────────────────────────────────────────────
  function classify(v) {
    if (v < 70)   return { label: 'Low',       cls: 'badge-low',     color: '#ef4444' };
    if (v <= 140) return { label: 'Normal',    cls: 'badge-normal',  color: '#22c55e' };
    if (v <= 180) return { label: 'High',      cls: 'badge-high',    color: '#f59e0b' };
    return           { label: 'Very High', cls: 'badge-veryhigh', color: '#ef4444' };
  }

  // ── GREETING ──────────────────────────────────────────────────
  function updateGreeting() {
    const h = new Date().getHours();
    const g = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
    const el = document.querySelector('.greeting h1');
    if (el) el.textContent = g;
  }

  // ── NAV ───────────────────────────────────────────────────────
  function setupNav() {
    document.querySelectorAll('.tab-btn[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });
    document.getElementById('fabScan').addEventListener('click', openCamera);
  }

  function switchTab(tab) {
    ['home', 'history'].forEach(name => {
      const screen = document.getElementById(name + 'Screen');
      const btn = document.getElementById('tab' + name.charAt(0).toUpperCase() + name.slice(1));
      screen.classList.toggle('active', name === tab);
      if (btn) btn.classList.toggle('active', name === tab);
    });
    if (tab === 'home') renderHome();
    if (tab === 'history') renderHistory();
  }

  // ── RENDER ALL ────────────────────────────────────────────────
  function renderAll() {
    renderHome();
    renderHistory();
  }

  // ── HOME ──────────────────────────────────────────────────────
  function renderHome() {
    const el = document.getElementById('latestDisplay');
    if (readings.length) {
      const r = readings[0];
      const s = classify(r.value);
      const time = new Date(r.timestamp).toLocaleString(undefined, {
        month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
      el.innerHTML = `
        <span class="latest-value" style="color:${s.color}">${r.value}</span><span class="latest-unit">mg/dL</span><br>
        <span class="status-badge ${s.cls}">${s.label}</span>
        <div style="font-size:12px;color:var(--text-muted);margin-top:8px">${time}${r.tag ? ' · ' + r.tag : ''}</div>
      `;
    } else {
      el.innerHTML = '<div class="no-data-hint">No readings yet — tap 📷 to scan</div>';
    }

    // Stats
    const now = Date.now();
    const d7  = readings.filter(r => now - r.timestamp <= 7  * 86400000).map(r => r.value);
    const d30 = readings.filter(r => now - r.timestamp <= 30 * 86400000).map(r => r.value);
    const avg = arr => arr.length ? Math.round(arr.reduce((s, v) => s + v, 0) / arr.length) : null;
    const inRng = d30.filter(v => v >= 70 && v <= 180).length;
    const pct = d30.length ? Math.round(inRng / d30.length * 100) : null;

    document.getElementById('avg7').textContent   = avg(d7)  !== null ? avg(d7)  : '—';
    document.getElementById('avg30').textContent  = avg(d30) !== null ? avg(d30) : '—';
    document.getElementById('inRange').textContent = pct !== null ? pct + '%' : '—';

    renderChart(currentRange);
  }

  // ── CHART ─────────────────────────────────────────────────────
  function setupChart() {
    document.querySelectorAll('.toggle-btn[data-days]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentRange = parseInt(btn.dataset.days);
        document.querySelectorAll('.toggle-btn[data-days]').forEach(b =>
          b.classList.toggle('active', parseInt(b.dataset.days) === currentRange)
        );
        renderChart(currentRange);
      });
    });
    window.addEventListener('resize', () => renderChart(currentRange));
  }

  function renderChart(days) {
    const canvas = document.getElementById('trendCanvas');
    const dpr = window.devicePixelRatio || 1;
    const parent = canvas.parentElement;
    const W = parent.clientWidth - 36; // card has 18px padding each side
    const H = 160;
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, W, H);

    const now = Date.now();
    const data = readings
      .filter(r => now - r.timestamp <= days * 86400000)
      .slice()
      .sort((a, b) => a.timestamp - b.timestamp);

    if (data.length < 2) {
      ctx.fillStyle = '#555';
      ctx.font = '13px -apple-system, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(data.length === 0 ? 'No data for this range' : 'Need more data', W / 2, H / 2);
      return;
    }

    const pad = { top: 14, bottom: 28, left: 38, right: 12 };
    const cW = W - pad.left - pad.right;
    const cH = H - pad.top - pad.bottom;

    const vals = data.map(r => r.value);
    const minV = Math.max(0,  Math.min(...vals) - 20);
    const maxV = Math.max(...vals) + 20;
    const range = maxV - minV || 1;

    const toX = i => pad.left + (i / (data.length - 1)) * cW;
    const toY = v => pad.top + cH - ((v - minV) / range * cH);

    // In-range band
    const bandY1 = toY(Math.min(180, maxV));
    const bandY2 = toY(Math.max(70,  minV));
    ctx.fillStyle = 'rgba(34,197,94,0.06)';
    ctx.fillRect(pad.left, bandY1, cW, Math.max(0, bandY2 - bandY1));

    // Reference lines at 70 and 180
    [70, 180].forEach(ref => {
      if (ref < minV || ref > maxV) return;
      const y = toY(ref);
      ctx.beginPath();
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = ref === 70 ? 'rgba(239,68,68,0.35)' : 'rgba(245,158,11,0.35)';
      ctx.lineWidth = 1;
      ctx.moveTo(pad.left, y);
      ctx.lineTo(pad.left + cW, y);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = ref === 70 ? 'rgba(239,68,68,0.55)' : 'rgba(245,158,11,0.55)';
      ctx.font = '9px -apple-system, system-ui, sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(ref, pad.left - 3, y + 3);
    });

    // Y-axis labels
    ctx.fillStyle = '#555';
    ctx.font = '9px -apple-system, system-ui, sans-serif';
    ctx.textAlign = 'right';
    [minV, Math.round((minV + maxV) / 2), maxV].forEach(v => {
      const y = toY(v);
      ctx.fillText(Math.round(v), pad.left - 3, y + 3);
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth = 1;
      ctx.setLineDash([]);
      ctx.moveTo(pad.left, y);
      ctx.lineTo(pad.left + cW, y);
      ctx.stroke();
    });

    // X-axis date labels (3 evenly spaced)
    ctx.fillStyle = '#555';
    ctx.font = '9px -apple-system, system-ui, sans-serif';
    ctx.textAlign = 'center';
    const labelIdxs = [0, Math.floor((data.length - 1) / 2), data.length - 1];
    labelIdxs.forEach(i => {
      const d = new Date(data[i].timestamp);
      const lbl = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      ctx.fillText(lbl, toX(i), H - 6);
    });

    // Line gradient fill
    const grad = ctx.createLinearGradient(0, pad.top, 0, pad.top + cH);
    grad.addColorStop(0, 'rgba(59,130,246,0.18)');
    grad.addColorStop(1, 'rgba(59,130,246,0)');
    ctx.beginPath();
    data.forEach((r, i) => {
      i === 0 ? ctx.moveTo(toX(i), toY(r.value)) : ctx.lineTo(toX(i), toY(r.value));
    });
    ctx.lineTo(toX(data.length - 1), pad.top + cH);
    ctx.lineTo(toX(0), pad.top + cH);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // Line
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(59,130,246,0.75)';
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    data.forEach((r, i) => {
      i === 0 ? ctx.moveTo(toX(i), toY(r.value)) : ctx.lineTo(toX(i), toY(r.value));
    });
    ctx.stroke();

    // Dots
    data.forEach((r, i) => {
      const x = toX(i), y = toY(r.value);
      const c = classify(r.value);
      ctx.beginPath();
      ctx.arc(x, y, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = c.color;
      ctx.fill();
      ctx.strokeStyle = '#0a0a0a';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    });
  }

  // ── HISTORY ───────────────────────────────────────────────────
  function setupHistory() {
    document.getElementById('exportBtn').addEventListener('click', exportCSV);
  }

  function renderHistory() {
    const el = document.getElementById('historyList');
    if (!readings.length) {
      el.innerHTML = '<div class="empty-history">No readings yet.<br>Tap 📷 to scan your first glucose reading.</div>';
      return;
    }

    const today = new Date(); today.setHours(0, 0, 0, 0);
    const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);

    const groups = {};
    const order = [];
    readings.forEach(r => {
      const d = new Date(r.timestamp); d.setHours(0, 0, 0, 0);
      let label;
      if (d.getTime() === today.getTime()) label = 'Today';
      else if (d.getTime() === yesterday.getTime()) label = 'Yesterday';
      else label = d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
      if (!groups[label]) { groups[label] = []; order.push(label); }
      groups[label].push(r);
    });

    let html = '';
    order.forEach(day => {
      html += `<div class="day-group"><div class="day-label">${day}</div>`;
      groups[day].forEach(r => {
        const t = new Date(r.timestamp).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
        const s = classify(r.value);
        html += `<div class="reading-row" data-id="${r.id}">
          <div class="color-dot" style="background:${s.color}"></div>
          <div class="row-value" style="color:${s.color}">${r.value}</div>
          <div class="row-tag">${r.tag || '—'}</div>
          <div class="row-time">${t}</div>
        </div>`;
      });
      html += '</div>';
    });
    el.innerHTML = html;

    el.querySelectorAll('.reading-row[data-id]').forEach(row => {
      row.addEventListener('click', () => promptDelete(row.dataset.id));
    });
  }

  // ── DELETE ────────────────────────────────────────────────────
  function setupDelete() {
    document.getElementById('cancelDeleteBtn').addEventListener('click', closeDeleteModal);
    document.getElementById('confirmDeleteBtn').addEventListener('click', doDelete);
    document.getElementById('deleteModal').addEventListener('click', e => {
      if (e.target === document.getElementById('deleteModal')) closeDeleteModal();
    });
  }

  function promptDelete(id) {
    const r = readings.find(x => x.id === id);
    if (!r) return;
    pendingDeleteId = id;
    document.getElementById('deleteDesc').textContent =
      `${r.value} mg/dL — ${r.tag || '—'} — ${new Date(r.timestamp).toLocaleString()}`;
    document.getElementById('deleteModal').classList.add('open');
  }

  function closeDeleteModal() {
    document.getElementById('deleteModal').classList.remove('open');
    pendingDeleteId = null;
  }

  function doDelete() {
    if (!pendingDeleteId) return;
    deleteReadingById(pendingDeleteId);
    closeDeleteModal();
    renderHistory();
    renderHome();
    showToast('Reading deleted');
  }

  // ── CAMERA ────────────────────────────────────────────────────
  function setupScan() {
    document.getElementById('closeCameraBtn').addEventListener('click', closeCamera);
    document.getElementById('captureBtn').addEventListener('click', captureAndOCR);
    document.getElementById('manualFallbackBtn').addEventListener('click', () => {
      closeCamera();
      openManualEntry();
    });
  }

  async function openCamera() {
    document.getElementById('cameraScreen').classList.add('active');
    document.getElementById('processingOverlay').classList.remove('show');
    try {
      videoStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      const v = document.getElementById('videoEl');
      v.srcObject = videoStream;
      await v.play();
    } catch (err) {
      closeCamera();
      if (err.name === 'NotAllowedError') {
        showToast('Camera permission denied — enter manually');
        openManualEntry();
      } else if (err.name === 'NotFoundError') {
        showToast('No camera found — enter manually');
        openManualEntry();
      } else {
        showToast('Camera unavailable — enter manually');
        openManualEntry();
      }
    }
  }

  function closeCamera() {
    stopVideoStream();
    document.getElementById('cameraScreen').classList.remove('active');
    document.getElementById('processingOverlay').classList.remove('show');
  }

  function stopVideoStream() {
    if (videoStream) {
      videoStream.getTracks().forEach(t => t.stop());
      videoStream = null;
    }
  }

  async function captureAndOCR() {
    const video   = document.getElementById('videoEl');
    const canvas  = document.getElementById('captureCanvas');
    const proc    = document.getElementById('processingOverlay');
    const procTxt = document.getElementById('procText');
    proc.classList.add('show');
    procTxt.textContent = 'Capturing frame…';

    // Crop guide-box region (~75% width, 30% height from center)
    const vw = video.videoWidth  || video.clientWidth;
    const vh = video.videoHeight || video.clientHeight;
    const cropW = vw * 0.75;
    const cropH = cropW / 2.5;
    const cropX = (vw - cropW) / 2;
    const cropY = (vh - cropH) / 2;

    canvas.width  = cropW;
    canvas.height = cropH;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

    // Upscale & binarize for better OCR accuracy
    const scale = 3;
    const oc = document.createElement('canvas');
    oc.width  = cropW * scale;
    oc.height = cropH * scale;
    const octx = oc.getContext('2d');
    octx.imageSmoothingEnabled = false;
    octx.drawImage(canvas, 0, 0, oc.width, oc.height);
    const id = octx.getImageData(0, 0, oc.width, oc.height);
    for (let i = 0; i < id.data.length; i += 4) {
      const g = 0.299 * id.data[i] + 0.587 * id.data[i + 1] + 0.114 * id.data[i + 2];
      const c = g > 128 ? 255 : 0;
      id.data[i] = id.data[i + 1] = id.data[i + 2] = c;
    }
    octx.putImageData(id, 0, 0);

    procTxt.textContent = 'Reading display…';
    try {
      const Tess = window.Tesseract;
      if (!Tess) throw new Error('Tesseract not loaded');
      const result = await Tess.recognize(oc, 'eng', {
        tessedit_char_whitelist: '0123456789.',
        tessedit_pageseg_mode: '7'
      });
      const text = result.data.text.replace(/\s+/g, '');
      const num  = parseOCRText(text);
      proc.classList.remove('show');
      if (num !== null) {
        stopVideoStream();
        document.getElementById('cameraScreen').classList.remove('active');
        openConfirmScreen(num, 'scan');
      } else {
        showToast('Could not read a number — try again or enter manually');
      }
    } catch (err) {
      proc.classList.remove('show');
      showToast('OCR failed — please enter manually');
      console.error('OCR:', err);
    }
  }

  function parseOCRText(text) {
    const matches = text.match(/\d+(?:\.\d+)?/g) || [];
    for (const m of matches) {
      const v = parseFloat(m);
      if (v >= 20 && v <= 600) return Math.round(v);
    }
    return null;
  }

  // ── CONFIRM SCREEN ────────────────────────────────────────────
  function setupConfirm() {
    document.getElementById('closeConfirmBtn').addEventListener('click',  closeConfirmScreen);
    document.getElementById('discardConfirmBtn').addEventListener('click', closeConfirmScreen);
    document.getElementById('saveConfirmedBtn').addEventListener('click',  saveConfirmed);
  }
  // Call setupConfirm eagerly (elements are in DOM)
  setupConfirm();

  function openConfirmScreen(value, source) {
    pendingValue  = value;
    pendingSource = source;
    currentTag    = '';
    const s = classify(value);
    document.getElementById('confirmNum').textContent  = value;
    document.getElementById('confirmNum').style.color  = s.color;
    document.getElementById('confirmTitle').textContent =
      source === 'scan' ? `Found: ${value} mg/dL — confirm?` : 'Confirm Reading';
    renderTagGrid('confirmTags');
    document.getElementById('confirmScreen').classList.add('active');
  }

  function closeConfirmScreen() {
    document.getElementById('confirmScreen').classList.remove('active');
    pendingValue = null;
  }

  function saveConfirmed() {
    if (pendingValue === null) return;
    addReading(pendingValue, currentTag, pendingSource);
    closeConfirmScreen();
    renderAll();
    showToast('Reading saved ✓');
  }

  // ── MANUAL ENTRY ──────────────────────────────────────────────
  function setupManual() {
    document.getElementById('closeManualBtn').addEventListener('click', closeManualEntry);
    document.getElementById('manualSaveBtn').addEventListener('click',  saveManual);
    document.getElementById('manualModal').addEventListener('click', e => {
      if (e.target === document.getElementById('manualModal')) closeManualEntry();
    });
  }

  function openManualEntry() {
    currentTag = '';
    document.getElementById('manualInput').value = '';
    renderTagGrid('manualTags');
    document.getElementById('manualModal').classList.add('open');
    setTimeout(() => document.getElementById('manualInput').focus(), 320);
  }

  function closeManualEntry() {
    document.getElementById('manualModal').classList.remove('open');
  }

  function saveManual() {
    const v = parseInt(document.getElementById('manualInput').value, 10);
    if (!v || v < 20 || v > 600) {
      showToast('Enter a value between 20 and 600');
      return;
    }
    addReading(v, currentTag, 'manual');
    closeManualEntry();
    renderAll();
    showToast('Reading saved ✓');
  }

  // ── TAG GRID ──────────────────────────────────────────────────
  function renderTagGrid(containerId) {
    const el = document.getElementById(containerId);
    el.innerHTML = TAGS.map(t =>
      `<button class="tag-pill${currentTag === t ? ' selected' : ''}" data-tag="${t}">${t}</button>`
    ).join('');
    el.querySelectorAll('.tag-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        currentTag = currentTag === btn.dataset.tag ? '' : btn.dataset.tag;
        renderTagGrid(containerId);
      });
    });
  }

  // ── EXPORT CSV ────────────────────────────────────────────────
  function exportCSV() {
    if (!readings.length) { showToast('No data to export'); return; }
    const rows = ['ID,Value (mg/dL),Tag,Timestamp,Source'];
    readings.forEach(r => {
      rows.push(`${r.id},${r.value},"${(r.tag || '').replace(/"/g, '""')}",${new Date(r.timestamp).toISOString()},${r.source}`);
    });
    const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `glucoscan_${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ── TOAST ─────────────────────────────────────────────────────
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
  }

}); // end DOMContentLoaded
</script>
</body>
