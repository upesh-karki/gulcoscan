<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GlucoScan</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  :root {
    --bg: #0a0a0a;
    --card: #161616;
    --border: rgba(255,255,255,0.07);
    --accent: #3b82f6;
    --accent-dim: rgba(59,130,246,0.15);
    --text: #f0f0f0;
    --text-muted: #888;
    --low: #ef4444;
    --normal: #22c55e;
    --high: #f59e0b;
    --very-high: #ef4444;
    --tab-h: 64px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Inter', system-ui, sans-serif;
    overflow: hidden;
  }

  /* ── SCREENS ── */
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; overflow: hidden; }
  .screen.active { display: flex; }

  .scroll-area {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding-bottom: calc(var(--tab-h) + var(--safe-bottom) + 80px);
    -webkit-overflow-scrolling: touch;
  }

  /* ── HEADER ── */
  .app-header {
    padding: 52px 20px 16px;
    background: var(--bg);
    flex-shrink: 0;
  }
  .app-header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .app-header p { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

  /* ── CARDS ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    margin: 0 16px 14px;
  }
  .card-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }

  /* ── LATEST READING ── */
  .latest-value {
    font-size: 72px;
    font-weight: 800;
    letter-spacing: -3px;
    line-height: 1;
  }
  .latest-unit { font-size: 18px; font-weight: 400; color: var(--text-muted); margin-left: 4px; }
  .status-badge {
    display: inline-block;
    margin-top: 10px;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .badge-low    { background: rgba(239,68,68,0.18); color: var(--low); }
  .badge-normal { background: rgba(34,197,94,0.18); color: var(--normal); }
  .badge-high   { background: rgba(245,158,11,0.18); color: var(--high); }
  .badge-veryhigh { background: rgba(239,68,68,0.18); color: var(--very-high); }

  .no-data-hint { color: var(--text-muted); font-size: 15px; padding: 8px 0; }

  /* ── STATS ROW ── */
  .stats-row { display: flex; gap: 10px; margin: 0 16px 14px; }
  .stat-chip {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 8px;
    text-align: center;
  }
  .stat-chip .val { font-size: 20px; font-weight: 700; }
  .stat-chip .lbl { font-size: 10px; color: var(--text-muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.5px; }

  /* ── CHART ── */
  .chart-toggles { display: flex; gap: 6px; margin-bottom: 14px; }
  .toggle-btn {
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .toggle-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  #trendCanvas { width: 100%; border-radius: 8px; display: block; }

  /* ── TAB BAR ── */
  .tab-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: calc(var(--tab-h) + var(--safe-bottom));
    background: rgba(10,10,10,0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 100;
    padding-bottom: var(--safe-bottom);
  }
  .tab-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 500;
    cursor: pointer;
    transition: color 0.15s;
  }
  .tab-btn .tab-icon { font-size: 22px; }
  .tab-btn.active { color: var(--accent); }

  /* ── FAB ── */
  #fabScan {
    position: fixed;
    bottom: calc(var(--tab-h) + var(--safe-bottom) + 14px);
    left: 50%;
    transform: translateX(-50%);
    width: 64px; height: 64px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    color: white;
    font-size: 26px;
    cursor: pointer;
    z-index: 200;
    box-shadow: 0 4px 24px rgba(59,130,246,0.5);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  #fabScan:active { transform: translateX(-50%) scale(0.93); box-shadow: 0 2px 12px rgba(59,130,246,0.4); }

  /* ── HISTORY ── */
  .history-header {
    padding: 52px 20px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .history-header h2 { font-size: 22px; font-weight: 700; }
  .export-btn {
    padding: 7px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .day-group { padding: 0 16px; margin-bottom: 6px; }
  .day-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; padding: 10px 0 6px; }
  .reading-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .reading-row:active { background: rgba(255,255,255,0.05); }
  .color-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .row-value { font-size: 18px; font-weight: 700; min-width: 52px; }
  .row-tag { font-size: 12px; color: var(--text-muted); flex: 1; }
  .row-time { font-size: 12px; color: var(--text-muted); }
  .empty-history { text-align: center; color: var(--text-muted); padding: 60px 20px; font-size: 15px; }

  /* ── MODAL OVERLAY ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 300;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-sheet {
    background: #1a1a1a;
    border-radius: 24px 24px 0 0;
    padding: 24px 24px calc(24px + var(--safe-bottom));
    width: 100%;
    max-width: 480px;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 18px; }
  .modal-close {
    float: right;
    background: rgba(255,255,255,0.08);
    border: none; color: var(--text);
    width: 30px; height: 30px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  /* ── CAMERA SCREEN ── */
  #cameraScreen {
    background: #000;
    z-index: 400;
  }
  #cameraScreen .cam-header {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 50px 20px 16px;
    display: flex; align-items: center; gap: 14px;
    z-index: 10;
  }
  .back-btn {
    background: rgba(255,255,255,0.12);
    border: none; color: white;
    width: 38px; height: 38px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .cam-title { color: white; font-size: 17px; font-weight: 600; }
  #videoEl {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .cam-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 5; pointer-events: none;
  }
  .guide-box {
    width: 75vw; max-width: 300px;
    aspect-ratio: 2.5 / 1;
    border: 2px solid rgba(255,255,255,0.8);
    border-radius: 10px;
    position: relative;
  }
  .guide-box::before {
    content: 'Line up meter display';
    position: absolute; top: -28px; left: 0; right: 0;
    text-align: center; color: white; font-size: 13px;
    font-weight: 500; text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }
  /* Corner accents */
  .guide-box::after {
    content: '';
    position: absolute; inset: -2px;
    border-radius: 10px;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.45);
  }
  .cam-bottom {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 24px 24px calc(24px + var(--safe-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    z-index: 10;
  }
  #captureBtn {
    width: 70px; height: 70px; border-radius: 50%;
    background: white; border: 4px solid rgba(255,255,255,0.4);
    cursor: pointer; transition: transform 0.12s;
  }
  #captureBtn:active { transform: scale(0.9); }
  .cam-hint { color: rgba(255,255,255,0.6); font-size: 12px; }
  .manual-fallback {
    color: var(--accent); font-size: 14px; font-weight: 500;
    background: none; border: none; cursor: pointer; padding: 4px 8px;
  }
  #processingOverlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.75);
    display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; z-index: 20;
  }
  #processingOverlay.show { display: flex; }
  .spinner {
    width: 40px; height: 40px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.2);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .proc-text { color: white; font-size: 14px; }

  /* ── CONFIRM SCREEN ── */
  #confirmScreen { z-index: 500; background: var(--bg); }
  #confirmScreen .confirm-header {
    padding: 52px 20px 16px;
    display: flex; align-items: center; gap: 14px;
    flex-shrink: 0;
  }
  .confirm-body { padding: 0 20px; flex: 1; overflow-y: auto; }
  .confirm-found {
    text-align: center; padding: 30px 0 24px;
  }
  .confirm-found .big-num {
    font-size: 80px; font-weight: 800; letter-spacing: -3px;
    line-height: 1;
  }
  .confirm-found .unit-label { font-size: 20px; color: var(--text-muted); }
  .confirm-label { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
  .tags-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .tag-pill {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tag-pill.selected { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .save-btn {
    width: 100%; padding: 16px;
    background: var(--accent); border: none;
    color: white; font-size: 16px; font-weight: 700;
    border-radius: 14px; cursor: pointer;
    transition: opacity 0.15s;
    margin-bottom: 12px;
  }
  .save-btn:active { opacity: 0.85; }
  .rescan-btn {
    width: 100%; padding: 14px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--text-muted); font-size: 14px; font-weight: 600;
    border-radius: 14px; cursor: pointer;
    margin-bottom: calc(var(--tab-h) + var(--safe-bottom) + 20px);
  }

  /* ── MANUAL ENTRY ── */
  .manual-input-wrap { position: relative; margin-bottom: 20px; }
  .manual-input {
    width: 100%; padding: 16px 60px 16px 18px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; color: var(--text); font-size: 28px;
    font-weight: 700; outline: none; text-align: center;
    -webkit-appearance: none;
  }
  .manual-input:focus { border-color: var(--accent); }
  .manual-unit { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; }

  /* ── DELETE CONFIRM ── */
  .delete-actions { display: flex; gap: 10px; margin-top: 10px; }
  .del-cancel { flex:1; padding: 14px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; color: var(--text-muted); font-size: 14px; font-weight: 600; cursor: pointer; }
  .del-confirm { flex:1; padding: 14px; background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); border-radius: 12px; color: var(--low); font-size: 14px; font-weight: 600; cursor: pointer; }

  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: calc(var(--tab-h) + var(--safe-bottom) + 20px);
    left: 50%; transform: translateX(-50%) translateY(20px);
    background: #333; color: white; padding: 10px 20px;
    border-radius: 20px; font-size: 13px; font-weight: 500;
    opacity: 0; transition: all 0.3s; z-index: 999; white-space: nowrap;
    pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- ════════════════════════════════════════════
     HOME SCREEN
════════════════════════════════════════════ -->
<div id="homeScreen" class="screen active">
  <div class="app-header">
    <h1>GlucoScan</h1>
    <p>Track glucose in seconds</p>
  </div>
  <div class="scroll-area">
    <!-- Latest reading -->
    <div class="card" id="latestCard">
      <div class="card-label">Latest Reading</div>
      <div id="latestDisplay" class="no-data-hint">No readings yet — tap 📷 to scan</div>
    </div>

    <!-- Stats row -->
    <div class="stats-row">
      <div class="stat-chip"><div class="val" id="avg7">—</div><div class="lbl">7-Day Avg</div></div>
      <div class="stat-chip"><div class="val" id="avg30">—</div><div class="lbl">30-Day Avg</div></div>
      <div class="stat-chip"><div class="val" id="inRange">—</div><div class="lbl">% In Range</div></div>
    </div>

    <!-- Trend chart -->
    <div class="card">
      <div class="card-label">Trend</div>
      <div class="chart-toggles">
        <button class="toggle-btn active" data-days="10" onclick="setChartDays(10)">10D</button>
        <button class="toggle-btn" data-days="30" onclick="setChartDays(30)">30D</button>
        <button class="toggle-btn" data-days="365" onclick="setChartDays(365)">1Y</button>
      </div>
      <canvas id="trendCanvas" height="160"></canvas>
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════════
     HISTORY SCREEN
════════════════════════════════════════════ -->
<div id="historyScreen" class="screen">
  <div class="history-header">
    <h2>History</h2>
    <button class="export-btn" onclick="exportCSV()">⬇ Export CSV</button>
  </div>
  <div class="scroll-area" id="historyList"></div>
</div>

<!-- ════════════════════════════════════════════
     CAMERA SCREEN
════════════════════════════════════════════ -->
<div id="cameraScreen" class="screen">
  <div class="cam-header">
    <button class="back-btn" onclick="closeCamera()">✕</button>
    <span class="cam-title">Scan Glucose Meter</span>
  </div>
  <video id="videoEl" autoplay playsinline muted></video>
  <div class="cam-overlay">
    <div class="guide-box"></div>
  </div>
  <div class="cam-bottom">
    <div class="cam-hint">Point camera at meter display</div>
    <button id="captureBtn" onclick="captureAndOCR()"></button>
    <button class="manual-fallback" onclick="openManualEntry()">Enter manually instead</button>
  </div>
  <div id="processingOverlay">
    <div class="spinner"></div>
    <div class="proc-text" id="procText">Scanning...</div>
  </div>
</div>

<!-- ════════════════════════════════════════════
     CONFIRM SCREEN
════════════════════════════════════════════ -->
<div id="confirmScreen" class="screen">
  <div class="confirm-header">
    <button class="back-btn" onclick="closeConfirm()">✕</button>
    <span class="cam-title" id="confirmTitle">Confirm Reading</span>
  </div>
  <div class="confirm-body">
    <div class="confirm-found">
      <div class="big-num" id="confirmNum">—</div>
      <div class="unit-label">mg/dL</div>
    </div>
    <div class="confirm-label">Select tag (optional)</div>
    <div class="tags-grid" id="confirmTags"></div>
    <button class="save-btn" onclick="saveConfirmed()">Save Reading</button>
    <button class="rescan-btn" onclick="closeConfirm()">Discard</button>
  </div>
</div>

<!-- ════════════════════════════════════════════
     MANUAL ENTRY MODAL
════════════════════════════════════════════ -->
<div class="modal-overlay" id="manualModal">
  <div class="modal-sheet">
    <div class="modal-title">Manual Entry <button class="modal-close" onclick="closeManualEntry()">✕</button></div>
    <div class="manual-input-wrap">
      <input type="number" class="manual-input" id="manualInput" placeholder="0" min="20" max="600" inputmode="numeric">
      <span class="manual-unit">mg/dL</span>
    </div>
    <div class="confirm-label">Tag (optional)</div>
    <div class="tags-grid" id="manualTags"></div>
    <button class="save-btn" onclick="saveManual()">Save Reading</button>
  </div>
</div>

<!-- ════════════════════════════════════════════
     DELETE CONFIRM MODAL
════════════════════════════════════════════ -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal-sheet">
    <div class="modal-title">Delete Reading?</div>
    <div style="color:var(--text-muted);font-size:14px;" id="deleteDesc"></div>
    <div class="delete-actions">
      <button class="del-cancel" onclick="closeDeleteModal()">Cancel</button>
      <button class="del-confirm" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════════
     TAB BAR + FAB
════════════════════════════════════════════ -->
<div class="tab-bar">
  <button class="tab-btn active" id="tabHome" onclick="switchTab('home')">
    <span class="tab-icon">🏠</span>Home
  </button>
  <button class="tab-btn" id="tabHistory" onclick="switchTab('history')">
    <span class="tab-icon">📋</span>History
  </button>
</div>
<button id="fabScan" onclick="openCamera()">📷</button>

<div id="toast"></div>

<!-- hidden canvas for OCR capture -->
<canvas id="captureCanvas" style="display:none"></canvas>

<script>
'use strict';

// ─── CONSTANTS ────────────────────────────────────────────────
const STORAGE_KEY = 'glucoscan_v1';
const TAGS = ['Before meal', 'After meal', 'Fasting', 'Bedtime', 'Random'];

// Color helpers
function getColor(v) {
  if (v < 70) return '#ef4444';
  if (v <= 140) return '#22c55e';
  if (v <= 180) return '#f59e0b';
  return '#ef4444';
}
function getStatus(v) {
  if (v < 70) return { label: 'Low', cls: 'badge-low' };
  if (v <= 140) return { label: 'Normal', cls: 'badge-normal' };
  if (v <= 180) return { label: 'High', cls: 'badge-high' };
  return { label: 'Very High', cls: 'badge-veryhigh' };
}

// ─── DATA ─────────────────────────────────────────────────────
function loadData() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function saveData(arr) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
}
function addReading(value, tag, source = 'manual') {
  const arr = loadData();
  arr.unshift({ id: crypto.randomUUID(), value, tag, timestamp: Date.now(), source });
  saveData(arr);
}
function deleteReading(id) {
  saveData(loadData().filter(r => r.id !== id));
}

// ─── SAMPLE DATA SEED ─────────────────────────────────────────
(function seedSampleData() {
  if (loadData().length > 0) return;
  const now = Date.now();
  const DAY = 86400000;
  const tags = TAGS;
  const readings = [];
  for (let d = 21; d >= 0; d--) {
    // 2–4 readings per day
    const count = 2 + Math.floor(Math.random() * 3);
    for (let i = 0; i < count; i++) {
      const t = now - d * DAY + (6 + i * 5 + Math.random() * 3) * 3600000;
      // Realistic: fasting ~95-110, post-meal ~120-165, random ~90-145
      const base = [95, 125, 155, 105, 135][i % 5];
      const val = Math.round(base + (Math.random() - 0.5) * 30);
      readings.push({
        id: crypto.randomUUID(),
        value: Math.max(72, Math.min(175, val)),
        tag: tags[i % tags.length],
        timestamp: Math.round(t),
        source: 'sample'
      });
    }
  }
  readings.sort((a, b) => b.timestamp - a.timestamp);
  saveData(readings);
})();

// ─── STATS ────────────────────────────────────────────────────
function avg(arr) { return arr.length ? Math.round(arr.reduce((s,v)=>s+v,0)/arr.length) : null; }
function calcStats() {
  const data = loadData();
  const now = Date.now();
  const d7 = data.filter(r => now - r.timestamp <= 7*86400000).map(r=>r.value);
  const d30 = data.filter(r => now - r.timestamp <= 30*86400000).map(r=>r.value);
  const inRange = d30.filter(v=>v>=70&&v<=180).length;
  const pct = d30.length ? Math.round(inRange/d30.length*100) : null;
  return { avg7: avg(d7), avg30: avg(d30), pct };
}

// ─── HOME RENDER ──────────────────────────────────────────────
function renderHome() {
  const data = loadData();
  // Latest
  const el = document.getElementById('latestDisplay');
  if (data.length) {
    const r = data[0];
    const s = getStatus(r.value);
    el.innerHTML = `<span class="latest-value" style="color:${getColor(r.value)}">${r.value}</span><span class="latest-unit">mg/dL</span><br><span class="status-badge ${s.cls}">${s.label}</span>`;
  } else {
    el.innerHTML = '<div class="no-data-hint">No readings yet — tap 📷 to scan</div>';
  }
  // Stats
  const s = calcStats();
  document.getElementById('avg7').textContent = s.avg7 !== null ? s.avg7 : '—';
  document.getElementById('avg30').textContent = s.avg30 !== null ? s.avg30 : '—';
  document.getElementById('inRange').textContent = s.pct !== null ? s.pct + '%' : '—';
  // Chart
  renderChart(currentChartDays);
}

// ─── CHART ────────────────────────────────────────────────────
let currentChartDays = 10;
function setChartDays(d) {
  currentChartDays = d;
  document.querySelectorAll('.toggle-btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.days) === d);
  });
  renderChart(d);
}

function renderChart(days) {
  const canvas = document.getElementById('trendCanvas');
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.parentElement.clientWidth - 0; // card padding accounted by CSS
  const H = 160;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const now = Date.now();
  const data = loadData().filter(r => now - r.timestamp <= days * 86400000)
    .sort((a,b) => a.timestamp - b.timestamp);

  if (data.length < 2) {
    ctx.fillStyle = '#555';
    ctx.font = '13px -apple-system, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Not enough data', W/2, H/2);
    return;
  }

  const pad = { top: 14, bottom: 24, left: 36, right: 12 };
  const cW = W - pad.left - pad.right;
  const cH = H - pad.top - pad.bottom;

  const vals = data.map(r=>r.value);
  const minV = Math.min(...vals, 60);
  const maxV = Math.max(...vals, 200);
  const range = maxV - minV || 1;

  function toX(i) { return pad.left + (i / (data.length-1)) * cW; }
  function toY(v) { return pad.top + cH - ((v - minV) / range * cH); }

  // Reference bands
  function drawBand(lo, hi, color) {
    const y1 = toY(Math.min(hi, maxV));
    const y2 = toY(Math.max(lo, minV));
    if (y2 <= y1) return;
    ctx.fillStyle = color;
    ctx.fillRect(pad.left, y1, cW, y2 - y1);
  }
  drawBand(70, 140, 'rgba(34,197,94,0.06)');

  // Y axis labels
  ctx.fillStyle = '#555';
  ctx.font = '10px -apple-system, system-ui, sans-serif';
  ctx.textAlign = 'right';
  const steps = [minV, Math.round((minV+maxV)/2), maxV];
  steps.forEach(v => {
    const y = toY(v);
    ctx.fillText(v, pad.left - 4, y + 4);
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    ctx.moveTo(pad.left, y);
    ctx.lineTo(pad.left + cW, y);
    ctx.stroke();
  });

  // Line
  ctx.beginPath();
  ctx.strokeStyle = 'rgba(59,130,246,0.6)';
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  data.forEach((r, i) => {
    i === 0 ? ctx.moveTo(toX(i), toY(r.value)) : ctx.lineTo(toX(i), toY(r.value));
  });
  ctx.stroke();

  // Dots
  data.forEach((r, i) => {
    ctx.beginPath();
    ctx.arc(toX(i), toY(r.value), 4, 0, Math.PI*2);
    ctx.fillStyle = getColor(r.value);
    ctx.fill();
    ctx.strokeStyle = '#0a0a0a';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });
}

// ─── HISTORY RENDER ───────────────────────────────────────────
function renderHistory() {
  const data = loadData();
  const el = document.getElementById('historyList');
  if (!data.length) {
    el.innerHTML = '<div class="empty-history">No readings yet.<br>Tap 📷 to scan your first glucose reading.</div>';
    return;
  }

  // Group by day
  const groups = {};
  const today = new Date(); today.setHours(0,0,0,0);
  const yesterday = new Date(today); yesterday.setDate(yesterday.getDate()-1);

  data.forEach(r => {
    const d = new Date(r.timestamp); d.setHours(0,0,0,0);
    let label;
    if (d.getTime() === today.getTime()) label = 'Today';
    else if (d.getTime() === yesterday.getTime()) label = 'Yesterday';
    else label = d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
    if (!groups[label]) groups[label] = [];
    groups[label].push(r);
  });

  let html = '';
  Object.entries(groups).forEach(([day, rows]) => {
    html += `<div class="day-group"><div class="day-label">${day}</div>`;
    rows.forEach(r => {
      const t = new Date(r.timestamp).toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
      html += `<div class="reading-row" onclick="promptDelete('${r.id}')">
        <div class="color-dot" style="background:${getColor(r.value)}"></div>
        <div class="row-value" style="color:${getColor(r.value)}">${r.value}</div>
        <div class="row-tag">${r.tag || '—'}</div>
        <div class="row-time">${t}</div>
      </div>`;
    });
    html += '</div>';
  });
  el.innerHTML = html;
}

// ─── TABS ─────────────────────────────────────────────────────
function switchTab(tab) {
  document.getElementById('homeScreen').classList.toggle('active', tab === 'home');
  document.getElementById('historyScreen').classList.toggle('active', tab === 'history');
  document.getElementById('tabHome').classList.toggle('active', tab === 'home');
  document.getElementById('tabHistory').classList.toggle('active', tab === 'history');
  if (tab === 'home') renderHome();
  if (tab === 'history') renderHistory();
}

// ─── CAMERA ───────────────────────────────────────────────────
let videoStream = null;
async function openCamera() {
  const screen = document.getElementById('cameraScreen');
  screen.classList.add('active');
  try {
    videoStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    const v = document.getElementById('videoEl');
    v.srcObject = videoStream;
    await v.play();
  } catch (err) {
    closeCamera();
    if (err.name === 'NotAllowedError') showToast('Camera permission denied');
    else if (err.name === 'NotFoundError') { showToast('No camera found'); openManualEntry(); }
    else { showToast('Camera unavailable — enter manually'); openManualEntry(); }
  }
}
function closeCamera() {
  stopStream();
  document.getElementById('cameraScreen').classList.remove('active');
  document.getElementById('processingOverlay').classList.remove('show');
}
function stopStream() {
  if (videoStream) { videoStream.getTracks().forEach(t => t.stop()); videoStream = null; }
}

// ─── CAPTURE + OCR ────────────────────────────────────────────
async function captureAndOCR() {
  const video = document.getElementById('videoEl');
  const canvas = document.getElementById('captureCanvas');
  const proc = document.getElementById('processingOverlay');
  const procText = document.getElementById('procText');
  proc.classList.add('show');
  procText.textContent = 'Capturing...';

  // Draw video frame to canvas (crop center guide region ~75% width, 30% height)
  const vw = video.videoWidth || video.clientWidth;
  const vh = video.videoHeight || video.clientHeight;
  const cropW = vw * 0.75;
  const cropH = cropW / 2.5;
  const cropX = (vw - cropW) / 2;
  const cropY = (vh - cropH) / 2;

  canvas.width = cropW;
  canvas.height = cropH;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

  // Upscale for better OCR
  const scale = 3;
  const ocCanvas = document.createElement('canvas');
  ocCanvas.width = cropW * scale;
  ocCanvas.height = cropH * scale;
  const oc = ocCanvas.getContext('2d');
  oc.imageSmoothingEnabled = false;
  oc.drawImage(canvas, 0, 0, ocCanvas.width, ocCanvas.height);

  // Pre-process: contrast boost
  const id = oc.getImageData(0, 0, ocCanvas.width, ocCanvas.height);
  for (let i = 0; i < id.data.length; i += 4) {
    const gray = 0.299*id.data[i] + 0.587*id.data[i+1] + 0.114*id.data[i+2];
    const c = gray > 128 ? 255 : 0;
    id.data[i] = id.data[i+1] = id.data[i+2] = c;
  }
  oc.putImageData(id, 0, 0);

  procText.textContent = 'Loading OCR engine...';

  try {
    // Lazy-load Tesseract
    if (!window.Tesseract) {
      await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
    }
    procText.textContent = 'Reading display...';
    const result = await Tesseract.recognize(ocCanvas, 'eng', {
      tessedit_char_whitelist: '0123456789.',
      tessedit_pageseg_mode: '7',
    });
    const text = result.data.text.replace(/\s/g, '');
    const num = parseOCRResult(text);
    proc.classList.remove('show');
    if (num !== null) {
      stopStream();
      document.getElementById('cameraScreen').classList.remove('active');
      openConfirm(num, 'scan');
    } else {
      showToast('Could not read a number — try again or enter manually');
      proc.classList.remove('show');
    }
  } catch (err) {
    proc.classList.remove('show');
    showToast('OCR failed — please enter manually');
    console.error('OCR error:', err);
  }
}

function parseOCRResult(text) {
  // Find all number-like sequences between 20 and 600
  const matches = text.match(/\d+(?:\.\d+)?/g) || [];
  for (const m of matches) {
    const v = parseFloat(m);
    if (v >= 20 && v <= 600) return Math.round(v);
  }
  return null;
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

// ─── CONFIRM SCREEN ───────────────────────────────────────────
let pendingValue = null;
let pendingSource = 'manual';
let selectedTag = '';

function openConfirm(value, source) {
  pendingValue = value;
  pendingSource = source;
  selectedTag = '';
  document.getElementById('confirmNum').textContent = value;
  document.getElementById('confirmNum').style.color = getColor(value);
  document.getElementById('confirmTitle').textContent = source === 'scan' ? `Found: ${value} mg/dL — confirm?` : 'Confirm Reading';
  renderTagGrid('confirmTags', () => {});
  document.getElementById('confirmScreen').classList.add('active');
}
function closeConfirm() {
  document.getElementById('confirmScreen').classList.remove('active');
  pendingValue = null;
}
function saveConfirmed() {
  if (pendingValue === null) return;
  addReading(pendingValue, selectedTag, pendingSource);
  closeConfirm();
  renderHome();
  showToast('Reading saved ✓');
}

// ─── MANUAL ENTRY ─────────────────────────────────────────────
function openManualEntry() {
  closeCamera();
  document.getElementById('manualInput').value = '';
  selectedTag = '';
  renderTagGrid('manualTags', () => {});
  document.getElementById('manualModal').classList.add('open');
  setTimeout(() => document.getElementById('manualInput').focus(), 300);
}
function closeManualEntry() {
  document.getElementById('manualModal').classList.remove('open');
}
function saveManual() {
  const v = parseInt(document.getElementById('manualInput').value);
  if (!v || v < 20 || v > 600) { showToast('Enter a value between 20 and 600'); return; }
  addReading(v, selectedTag, 'manual');
  closeManualEntry();
  renderHome();
  showToast('Reading saved ✓');
}

// ─── TAG GRID ─────────────────────────────────────────────────
function renderTagGrid(containerId) {
  const el = document.getElementById(containerId);
  el.innerHTML = TAGS.map(t => `<button class="tag-pill${selectedTag===t?' selected':''}" onclick="selectTag('${t}','${containerId}')">${t}</button>`).join('');
}
function selectTag(tag, containerId) {
  selectedTag = selectedTag === tag ? '' : tag;
  renderTagGrid(containerId);
}

// ─── DELETE ───────────────────────────────────────────────────
let pendingDeleteId = null;
function promptDelete(id) {
  const r = loadData().find(x=>x.id===id);
  if (!r) return;
  pendingDeleteId = id;
  document.getElementById('deleteDesc').textContent =
    `${r.value} mg/dL — ${r.tag || '—'} — ${new Date(r.timestamp).toLocaleString()}`;
  document.getElementById('deleteModal').classList.add('open');
}
function closeDeleteModal() { document.getElementById('deleteModal').classList.remove('open'); pendingDeleteId = null; }
function confirmDelete() {
  if (pendingDeleteId) { deleteReading(pendingDeleteId); closeDeleteModal(); renderHistory(); renderHome(); showToast('Reading deleted'); }
}

// ─── EXPORT CSV ───────────────────────────────────────────────
function exportCSV() {
  const data = loadData();
  if (!data.length) { showToast('No data to export'); return; }
  const rows = ['ID,Value (mg/dL),Tag,Timestamp,Source'];
  data.forEach(r => rows.push(`${r.id},${r.value},"${r.tag||''}",${new Date(r.timestamp).toISOString()},${r.source}`));
  const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `glucoscan_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

// ─── TOAST ────────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// ─── CLOSE MODALS ON OVERLAY CLICK ────────────────────────────
document.querySelectorAll('.modal-overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target === o) { o.classList.remove('open'); } });
});

// ─── RESIZE / INIT ────────────────────────────────────────────
window.addEventListener('resize', () => { if (currentChartDays) renderChart(currentChartDays); });

renderHome();
</script>
